<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rec: Sunday League</title>
<meta name="description" content="Help with The Rec, the grassroots football game for iPhone: purchases, backups, new phones and how to get in touch.">
<style>
  :root { --bg:#0e1611; --card:#16231b; --line:#2e3e32; --fg:#eef3ea; --muted:#b2bfb4; --green:#2f8a4e; --gold:#f0b43a; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:28px 16px 48px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
  header img { width:64px; height:64px; border-radius:15px; flex:none; }
  .kicker { color:var(--gold); font-size:13px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; margin:0; }
  h1 { font-size:28px; line-height:1.2; margin:2px 0 0; }
  .contact { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:12px; padding:14px 16px; margin:0 0 26px; }
  .contact p:last-child { margin-bottom:0; }
  h2 { color:var(--gold); font-size:19px; margin:28px 0 6px; }
  p { margin:0 0 12px; }
  a { color:var(--gold); }
  .muted { color:var(--muted); font-size:15px; }
  footer { margin-top:36px; padding-top:16px; border-top:1px solid var(--line); }
  nav a { margin-right:16px; }
</style>
</head>
<body>
<main>
  <img src="icon.jpg" alt="The Rec" width="96" height="96" style="border-radius:22px">
  <h1>The Rec</h1>
  <p>A Sunday league football game for iPhone. Take on a council pitch, a padlocked changing room and a rope round the grass, and build a club with your real mates.</p>
  <p><a href="support.html">Help and support</a> &middot; <a href="privacy.html">Privacy policy</a></p>
  <p class="muted">Questions? Email <a href="mailto:rob@the-rec-game.com">rob@the-rec-game.com</a>.<br>&copy; 2026 BlackmoreApps.</p>
</main>
</body></html>
